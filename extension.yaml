name: loric-edu-analytics
version: 0.0.1
specVersion: v1beta
displayName: LoricEdu
description: Analytics Aggregator for Loric Edu
icon: icon.png
license: Apache-2.0
sourceUrl: https://github.com/srikantloric/New-folder--2-
billingRequired: true

author:
  authorName: Loric Softwares
  email: extensions@loricsoftwares.com
  url: https://loricsoftwares.com/

params:
  - param: PROJECT_ID
    label: Firebase Project ID
    description: Project ID where the payments collection exists
    type: string
  - param: ENABLE_ANALYTICS
    label: Enable Analytics Aggregation
    description: Set to true to enable analytics logic, false to disable.
    type: select
    options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
    default: true
  - param: ENABLE_ATTENDANCE_PROCESSOR
    label: Enable Attendance Aggregation
    description: Set to true to process DAILY, MONTHLY, SCHOOL & CLASS summaries.
    type: select
    options:
      - label: Enabled
        value: true
      - label: Disabled
        value: false
    default: true
  - param: FIRESTORE_DATABASE_ID
    label: Firestore Database ID
    description: The ID of the Firestore database to use. Use "(default)" for the default database, or specify a custom database name for Firestore in Datastore mode (Enterprise).
    type: string
    default: (default)

resources:
  - name: onPaymentAdd
    type: firebaseextensions.v1beta.function
    properties:
      eventTrigger:
        eventType: providers/cloud.firestore/eventTypes/document.create
        resource: projects/${PROJECT_ID}/databases/${FIRESTORE_DATABASE_ID}/documents/MY_PAYMENTS/{paymentId}
      entryPoint: onPaymentAdd
      runtime: nodejs20

  - name: onPaymentDelete
    type: firebaseextensions.v1beta.function
    properties:
      eventTrigger:
        eventType: providers/cloud.firestore/eventTypes/document.delete
        resource: projects/${PROJECT_ID}/databases/${FIRESTORE_DATABASE_ID}/documents/MY_PAYMENTS/{paymentId}
      entryPoint: onPaymentDelete
      runtime: nodejs20
  - name: scheduledExecutiveReport
    type: firebaseextensions.v1beta.function
    description: Runs every day at 6 PM IST, checks toggle from Firestore, and sends SMS via Fast2SMS.
    properties:
      scheduleTrigger:
        schedule: "0 18 * * *"
  - name: onAttendanceEvent
    type: firebaseextensions.v1beta.function
    properties:
      eventTrigger:
        eventType: providers/cloud.firestore/eventTypes/document.create
        resource: projects/${PROJECT_ID}/databases/${FIRESTORE_DATABASE_ID}/documents/ATTENDANCE_EVENTS/{eventId}
      entryPoint: onAttendanceEvent
      runtime: nodejs20 
  - name: onNewStudentEvent
    type: firebaseextensions.v1beta.function
    properties:
      eventTrigger:
        eventType: providers/cloud.firestore/eventTypes/document.create
        resource: projects/${PROJECT_ID}/databases/${FIRESTORE_DATABASE_ID}/documents/STUDENTS/{studentId}
      entryPoint: onNewStudentEvent
      runtime: nodejs20            

roles:
  - role: datastore.owner
    reason: The extension needs to update aggregated analytics in Firestore.

  - role: datastore.user
    reason: The extension needs to read documents from Firestore.
